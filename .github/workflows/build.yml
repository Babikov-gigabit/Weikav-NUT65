name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest tests.test_core
      - run: pyinstaller --noconfirm --onefile --windowed --name NUT65-Control run.py
      - uses: actions/upload-artifact@v4
        with:
          name: NUT65-Control
          path: dist/NUT65-Control.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NUT65 Control ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/NUT65-Control.exe
          body: |
            NUT65 Control — локальная утилита для Weikav NUT65: подсветка, макросы, назначение клавиш.
            Скачайте `NUT65-Control.exe`, подключите клавиатуру кабелем USB и запустите. Python не нужен.
            Если Windows SmartScreen предупреждает: «Подробнее» → «Выполнить в любом случае».
